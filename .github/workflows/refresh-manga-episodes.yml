# noteから収録エピソード(episodes.json)と用語集リンク先の記事メタ
# (glossary/article-meta.json)を取得・更新するワークフロー。
# 手動実行（workflow_dispatch）と毎週月曜9時(JST)の定期実行。
# Claude Code のサンドボックスからは note.com に到達できないため、
# 取得はこのワークフロー（GitHub Actionsランナー）上で行う。
name: Refresh manga episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC = 09:00 JST
  # workflow_dispatch はデフォルトブランチにマージされるまで使えないため、
  # 開発ブランチではスクリプト/ワークフロー変更のpushでも起動する
  push:
    branches:
      - "claude/fable-content-strategy-ho65di"
    paths:
      - "scripts/fetch-manga-episodes.mjs"
      - "scripts/fetch-glossary-articles.mjs"
      - "scripts/fetch-note-articles.mjs"
      - "src/app/glossary/data.ts"
      - ".github/workflows/refresh-manga-episodes.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch episodes from note
        run: node scripts/fetch-manga-episodes.mjs
      - name: Fetch glossary article meta from note
        run: node scripts/fetch-glossary-articles.mjs
      - name: Fetch all note articles (top page 新着/人気)
        run: node scripts/fetch-note-articles.mjs
      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/manga/episodes.json src/app/glossary/article-meta.json src/app/note-articles.json
          git commit -m "chore: refresh note article data"
          git push
