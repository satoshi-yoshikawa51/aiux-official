# AI系ニュースRSSから見出しを取得し、/calendar の
# 「今日のAIニュース」データ(news-headlines.json)を更新するワークフロー。
# 毎朝7時(JST)の定期実行と手動実行(workflow_dispatch)。
# Claude Code のサンドボックスからは外部サイトに到達できないため、
# 取得はこのワークフロー（GitHub Actionsランナー）上で行う。
name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    # 毎時0分はGitHub Actionsの混雑で大幅遅延・スキップされやすいため、
    # 中途半端な分を指定し、遅延しても7時までに届くよう少し早めに回す
    - cron: "40 21 * * *" # 毎日 21:40 UTC = 翌朝 06:40 JST
  # workflow_dispatch はデフォルトブランチにマージされるまで使えないため、
  # 開発ブランチではスクリプト/ワークフロー変更のpushでも起動する
  push:
    branches:
      - "claude/comixai-news-logic-review-nctc2c"
    paths:
      - "scripts/fetch-ai-news.mjs"
      - ".github/workflows/refresh-ai-news.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch AI news headlines
        run: node scripts/fetch-ai-news.mjs
        env:
          # 英語見出しの翻訳をClaude APIで行うためのキー。
          # リポジトリのSecretsに未設定なら空になるだけで、スクリプトは
          # 無料の翻訳エンドポイントに降格する（落ちはしない）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit & push if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/calendar/news-headlines.json src/app/calendar/event-images.json
          git commit -m "chore: refresh AI news headlines"
          # 取得から push までの数十秒のあいだに誰かが同じブランチへ
          # pushすると、素の git push は弾かれて取得結果ごと捨てられる
          # （2026-11-15、PRのマージと3秒差で実際に起きた）。
          # コミットの中身は生成ファイルだけなので、弾かれたら最新に
          # rebaseして載せ直し、最大5回まで試す。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/$GITHUB_REF_NAME (attempt $attempt)"
            sleep $((attempt * 5))
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "::error::push failed after 5 attempts"
          exit 1
