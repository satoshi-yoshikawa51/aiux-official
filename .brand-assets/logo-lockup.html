<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .stage{
    width:2400px;height:1200px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
    background:transparent;
  }
  .wordwrap{position:relative;display:inline-block;}
  /* 黄色のコミックバースト（背景アクセント） */
  .burst{
    position:absolute;inset:-180px -120px;z-index:0;
    filter:drop-shadow(0 18px 0 rgba(20,17,15,0.10));
  }
  .word{
    position:relative;z-index:1;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;
    font-size:430px;line-height:1;letter-spacing:0.005em;white-space:nowrap;
    -webkit-text-stroke:26px #fffaf0;paint-order:stroke fill;
    filter:drop-shadow(14px 18px 0 rgba(20,17,15,0.22));
  }
  .word .co,.word .ai{color:#14110f;}
  .word .mix{color:#e60012;}
  .tag{
    position:relative;z-index:1;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;
    font-size:108px;line-height:1;letter-spacing:0.04em;color:#14110f;
    -webkit-text-stroke:10px #fffaf0;paint-order:stroke fill;
    filter:drop-shadow(6px 8px 0 rgba(20,17,15,0.16));
  }
  .tag .hl{color:#e60012;}
</style>
</head>
<body>
  <div class="stage">
    <div class="wordwrap">
      <svg class="burst" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path fill="#ffd23f" d="M500 8l46 92 104-58-22 114 116 14-78 86 78 86-116 14 22 114-104-58-46 92-46-92-104 58 22-114-116-14 78-86-78-86 116-14-22-114 104 58z"/>
      </svg>
      <div class="word"><span class="co">CO</span><span class="mix">MIX</span><span class="ai">AI</span></div>
    </div>
    <div class="tag">AIを、<span class="hl">面白く</span>。わかりやすく。</div>
  </div>
</body>
</html>
