<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .stage{
    width:2400px;height:1000px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
  }
  .wordwrap{position:relative;display:inline-block;}
  .burst{
    position:absolute;inset:-200px -130px;z-index:0;
    filter:drop-shadow(0 18px 0 rgba(20,17,15,0.10));
  }
  .word{
    position:relative;z-index:1;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;
    font-size:460px;line-height:1;letter-spacing:0.005em;white-space:nowrap;
    -webkit-text-stroke:28px #fffaf0;paint-order:stroke fill;
    filter:drop-shadow(15px 19px 0 rgba(20,17,15,0.22));
  }
  .word .co,.word .ai{color:#14110f;}
  .word .mix{color:#e60012;}
</style>
</head>
<body>
  <div class="stage">
    <div class="wordwrap">
      <svg class="burst" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <path fill="#ffd23f" d="M500 8l46 92 104-58-22 114 116 14-78 86 78 86-116 14 22 114-104-58-46 92-46-92-104 58 22-114-116-14 78-86-78-86 116-14-22-114 104 58z"/>
      </svg>
      <div class="word"><span class="co">CO</span><span class="mix">MIX</span><span class="ai">AI</span></div>
    </div>
  </div>
</body>
</html>
